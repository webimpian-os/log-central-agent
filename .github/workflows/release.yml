name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-installer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Attach the installer
        # Log Central's install command downloads releases/latest/download/install.sh.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" install.sh uninstall.sh --clobber
