# Plesk's logs folders are readable only by root and psaadm.
[Service]
AmbientCapabilities=CAP_DAC_READ_SEARCH
CapabilityBoundingSet=CAP_DAC_READ_SEARCH
# That capability reads any file, so hide site files and secrets.
ProtectHome=yes
TemporaryFileSystem=/var/www:ro
BindReadOnlyPaths=/var/www/vhosts/system
InaccessiblePaths=-/etc/shadow -/etc/gshadow -/etc/psa -/usr/local/psa -/var/lib/psa -/var/lib/mysql -/var/qmail -/var/spool -/etc/pki/tls/private
