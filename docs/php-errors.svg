<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="312" viewBox="0 0 1200 312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#121c33"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c8aa5"/>
    </marker>
  </defs>

  <rect width="1200" height="312" rx="20" fill="url(#bg)"/>

  <text x="48" y="58" font-size="22" font-weight="700" fill="#f1f5f9">PHP errors: what the agent keeps</text>
  <text x="48" y="84" font-size="14" fill="#94a3b8">Real numbers from one RunCloud server with 6 sites, run over every PHP message in its Apache error logs.</text>

  <g>
    <rect x="40" y="112" width="250" height="168" rx="12" fill="#16213a" stroke="#26344f"/>
    <circle cx="62" cy="138" r="11" fill="#334155"/>
    <text x="62" y="142.5" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle">1</text>
    <text x="80" y="143" font-size="13.5" font-weight="700" fill="#e2e8f0">Read every line</text>
    <text x="60" y="200" font-size="32" font-weight="800" fill="#cbd5e1">167,832</text>
    <text x="60" y="222" font-size="12.5" fill="#cbd5e1">PHP messages</text>
    <text x="60" y="248" font-size="11.5" fill="#7c8aa5">everything Apache</text>
    <text x="60" y="264" font-size="11.5" fill="#7c8aa5">logged for 6 sites</text>
  </g>

  <line x1="292" y1="196" x2="326" y2="196" stroke="#7c8aa5" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="330" y="112" width="250" height="168" rx="12" fill="#16213a" stroke="#26344f"/>
    <circle cx="352" cy="138" r="11" fill="#78350f"/>
    <text x="352" y="142.5" font-size="12" font-weight="700" fill="#fde68a" text-anchor="middle">2</text>
    <text x="370" y="143" font-size="13.5" font-weight="700" fill="#e2e8f0">Keep fatal errors</text>
    <text x="350" y="200" font-size="32" font-weight="800" fill="#fbbf24">2,036</text>
    <text x="350" y="222" font-size="12.5" fill="#cbd5e1">fatal errors</text>
    <text x="350" y="248" font-size="11.5" fill="#7c8aa5">warnings, notices,</text>
    <text x="350" y="264" font-size="11.5" fill="#7c8aa5">deprecations dropped</text>
  </g>

  <line x1="582" y1="196" x2="616" y2="196" stroke="#7c8aa5" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="620" y="112" width="250" height="168" rx="12" fill="#16213a" stroke="#26344f"/>
    <circle cx="642" cy="138" r="11" fill="#4c1d95"/>
    <text x="642" y="142.5" font-size="12" font-weight="700" fill="#ddd6fe" text-anchor="middle">3</text>
    <text x="660" y="143" font-size="13.5" font-weight="700" fill="#e2e8f0">Skip bot noise</text>
    <text x="640" y="200" font-size="32" font-weight="800" fill="#a78bfa">1,055</text>
    <text x="640" y="222" font-size="12.5" fill="#cbd5e1">real errors</text>
    <text x="640" y="248" font-size="11.5" fill="#7c8aa5">bots opening plugin</text>
    <text x="640" y="264" font-size="11.5" fill="#7c8aa5">files directly dropped</text>
  </g>

  <line x1="872" y1="196" x2="906" y2="196" stroke="#7c8aa5" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="910" y="112" width="250" height="168" rx="12" fill="#13261f" stroke="#1f5c4a"/>
    <circle cx="932" cy="138" r="11" fill="#065f46"/>
    <text x="932" y="142.5" font-size="12" font-weight="700" fill="#a7f3d0" text-anchor="middle">4</text>
    <text x="950" y="143" font-size="13.5" font-weight="700" fill="#e2e8f0">Group repeats</text>
    <text x="930" y="200" font-size="32" font-weight="800" fill="#34d399">40</text>
    <text x="930" y="222" font-size="12.5" fill="#cbd5e1">error groups</text>
    <text x="930" y="248" font-size="11.5" fill="#7c8aa5">each sent at most</text>
    <text x="930" y="264" font-size="11.5" fill="#7c8aa5">once per 5 minutes</text>
  </g>
</svg>
