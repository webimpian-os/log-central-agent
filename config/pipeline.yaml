# Sources: config/panels/<panel>.yaml.
transforms:
  error_lines:
    type: remap
    inputs: [apache_error_logs, nginx_error_logs]
    drop_on_abort: true
    drop_on_error: true
    source: |
      raw = string!(.message)
      fatal = contains(raw, "PHP Fatal error:") || contains(raw, "PHP Parse error:")
      server = !contains(raw, "FastCGI sent in stderr") && match(raw, r'upstream|worker_connections|AH010(?:67|75|79)')
      if !fatal && !server { abort }

      host = string(.host) ?? "unknown"
      log_path = string(.file) ?? ""
      name = "unknown"
      domain = ""
      plesk = parse_regex(log_path, r'^/var/www/vhosts/system/(?P<domain>[^/]+)/logs/') ?? null
      runcloud = parse_regex(log_path, r'/logs/(?:apache2|nginx)/(?P<webapp>.+?)_error\.log(?:-\d+)?$') ?? null
      if plesk != null {
        domain = string!(plesk.domain)
        name = domain
      } else if runcloud != null {
        name = string!(runcloud.webapp)
        row, missing = get_enrichment_table_record("sites", {"webapp": name})
        if missing == null { domain = string(row.domain) ?? "" }
      }
      if domain == "" {
        # Native NGINX sites on RunCloud have no Apache config.
        found = parse_regex(raw, r', server: (?P<v>[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+),') ?? {}
        domain = string(found.v) ?? ""
      }

      .host = host
      .site_key = host + "/" + name
      .site_label = name
      .site_url = ""
      if domain != "" {
        .site_key = domain
        .site_label = domain
        .site_url = "https://" + domain
      }

  php_fatals:
    type: remap
    inputs: [error_lines]
    drop_on_abort: true
    drop_on_error: true
    source: |
      raw = string!(.message)
      if !contains(raw, "PHP Fatal error:") && !contains(raw, "PHP Parse error:") { abort }

      time = null
      body = ""
      escaped = false
      client = ""
      referrer = ""
      method = "-"
      path = ""

      if starts_with(raw, "[") {
        entry = parse_regex(raw, r'^\[(?P<time>\w{3} \w{3} \d{2} \d{2}:\d{2}:\d{2}(?:\.\d+)? \d{4})\] \[proxy_fcgi:error\] \[[^\]]*\](?: \[client (?P<client>[^\]]*)\])? AH01071: Got error \'(?P<body>.*)\'(?:, referer: (?P<referer>.*))?$') ?? null
        if entry == null { abort }
        time = parse_timestamp!(string!(entry.time), "%a %b %d %H:%M:%S%.f %Y")
        body = string!(entry.body)
        escaped = true
        client = replace(string(entry.client) ?? "", r':\d+$', "")
        referrer = string(entry.referer) ?? ""
      } else {
        entry = parse_regex(raw, r'(?s)^(?P<time>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) \[error\] \d+#\d+: (?:\*\d+ )?FastCGI sent in stderr: "(?P<body>.*?)(?:" while (?P<context>[^\n]*))?$') ?? null
        if entry == null { abort }
        time = parse_timestamp!(string!(entry.time), "%Y/%m/%d %H:%M:%S")
        body = string!(entry.body)
        context = string(entry.context) ?? ""
        found = parse_regex(context, r'client: (?P<v>[^,]+)') ?? {}
        client = string(found.v) ?? ""
        found = parse_regex(context, r'request: "(?P<method>[A-Z]+) (?P<path>[^ "?]*)') ?? {}
        method = string(found.method) ?? "-"
        path = string(found.path) ?? ""
        found = parse_regex(context, r'referrer: "(?P<v>[^"]*)"') ?? {}
        referrer = string(found.v) ?? ""
      }

      fatals = filter(split(body, "PHP message: ")) -> |_index, part| {
        starts_with(part, "PHP Fatal error:") || starts_with(part, "PHP Parse error:")
      }
      if length(fatals) == 0 { abort }

      # Later fatals are knock-on failures.
      text = replace(string!(fatals[0]), r'[;\s]+$', "")
      if escaped {
        text = replace_with(text, r'\\(.)') -> |escape| {
          char = string!(escape.captures[0])
          if char == "n" { "\n" } else if char == "t" { "\t" } else { char }
        }
      }
      text = replace(text, r'/home/[^/\s]+/webapps/[^/\s]+/', "")
      text = replace(text, r'/var/www/vhosts/[^/\s]+/', "")
      text = replace(text, r'(^|\s)/\S*\.\.\.$', "$1...")
      # PHP shortens long trace arguments mid-path.
      text = replace(text, r'\'/[^\'\s]*\.\.\.\'', "'...'")

      exception = if starts_with(text, "PHP Parse error:") { "PHP Parse error" } else { "PHP Fatal error" }
      message = replace(text, r'^PHP (?:Fatal|Parse) error:\s+', "")
      file = ""
      line = 0
      trace = ""

      uncaught = parse_regex(text, r'(?s)^PHP Fatal error:\s+Uncaught (?P<class>[^\s:]+): (?P<message>.*?) in (?P<file>\S+?):(?P<line>\d+)(?:\n(?P<rest>.*))?$') ?? null
      if uncaught == null {
        # PHP 5 format.
        uncaught = parse_regex(text, r'(?s)^PHP Fatal error:\s+Uncaught exception \'(?P<class>[^\']+)\' with message \'(?P<message>.*?)\' in (?P<file>\S+?):(?P<line>\d+)(?:\n(?P<rest>.*))?$') ?? null
      }
      plain = parse_regex(text, r'(?s)^PHP (?:Fatal|Parse) error:\s+(?P<message>.*) in (?P<file>\S+) on line (?P<line>\d+)') ?? null

      if uncaught != null {
        exception = string!(uncaught.class)
        message = string!(uncaught.message)
        file = string!(uncaught.file)
        line = to_int!(uncaught.line)
        trace = replace(string(uncaught.rest) ?? "", r'^Stack trace:\n', "")
        trace = replace(trace, r'(?s)\n\s*thrown in .*$', "")
        if !starts_with(trace, "#") { trace = "" }
        # nginx cuts long entries without a marker.
        if trace != "" && !ends_with(trace, "{main}") && !ends_with(trace, "...") {
          trace = replace(trace, r'(^|\s)/\S*$', "$1") + "..."
        }
      } else if plain != null {
        message = string!(plain.message)
        file = string!(plain.file)
        line = to_int!(plain.line)
      }

      # Bots hitting WordPress files directly, not a broken site.
      if contains(message, "ABSPATH") { abort }
      if trace == "#0 {main}" && match(file, r'(?:^|/)wp-(?:content|includes|admin/includes)/') { abort }

      owner = parse_regex(file, r'(?:^|/)wp-content/(?P<kind>plugins|mu-plugins|themes)/(?P<name>[^/\s(:]+)') ?? null
      owner_key = if owner != null { string!(owner.kind) + "/" + string!(owner.name) } else { "" }
      component = owner
      snippet = ""
      settled = false
      # The first frame from other code is the caller that misused it; WordPress itself calling in means the owner broke.
      for_each(split(trace, "\n")) -> |index, frame| {
        if !settled {
          if contains(frame, "/code-snippets/") && contains(frame, "eval()'d code") {
            next = string(get(split(trace, "\n"), [index + 1]) ?? "") ?? ""
            callee = parse_regex(next, r'\): (?P<fn>[^\s()]+)\(\)$') ?? {}
            snippet = string(callee.fn) ?? ""
            snippet = if snippet == "" || snippet == "eval" { "code" } else { snippet + "()" }
            settled = true
          } else {
            found = parse_regex(frame, r'wp-content/(?P<kind>plugins|mu-plugins|themes)/(?P<name>[^/\s(:]+)/') ?? null
            if found != null {
              if string!(found.kind) + "/" + string!(found.name) != owner_key {
                component = found
                settled = true
              }
            } else if owner != null && !contains(frame, "{main}") && !contains(frame, "[internal function]") {
              settled = true
            }
          }
        }
      }
      culprit = ""
      if snippet != "" {
        culprit = snippet + " snippet: "
      } else if component != null {
        kind = string!(component.kind)
        suffix = " plugin: "
        if kind == "themes" { suffix = " theme: " } else if kind == "mu-plugins" { suffix = " mu-plugin: " }
        culprit = replace(string!(component.name), r'\.php$', "") + suffix
      }
      # Built-ins hosts switch off with disable_functions; fixing the PHP setting beats blaming the caller.
      if match(message, r'(?i)^Call to undefined function (?:[\w\\]+\\)?(?:exec|shell_exec|system|passthru|popen|proc_\w+|pcntl_\w+|posix_\w+|socket_\w+|stream_socket_\w+|f?sockopen|pfsockopen|ignore_user_abort|set_time_limit|ini_set|ini_alter|ini_restore|putenv|symlink|link|tmpfile|getmyuid|disk_?free_?space|escapeshell(?:cmd|arg)|highlight_file|show_source|fpassthru|virtual|dl|curl_exec|curl_multi_exec|parse_ini_file|mail)\(\)') {
        culprit = "Disabled PHP function: "
      }

      site_key = string!(.site_key)
      url = string!(.site_url)
      if url != "" { url = url + path }

      . = {
        "timestamp": format_timestamp!(time, "%Y-%m-%d %H:%M:%S%.3f", timezone: "UTC"),
        "fingerprint": md5(site_key + "|" + exception + "|" + file + "|" + to_string(line)),
        "app": "SECRET[settings.app]",
        "environment": "production",
        "exception": exception,
        "message": "[" + string!(.site_label) + "] " + culprit + message,
        "file": file,
        "line": line,
        "trace": trace,
        "url": url,
        "method": method,
        "user_id": 0,
        "input": "{}",
        "hostname": string!(.host),
        "entrypoint": "http",
        "ip": client,
        "referrer": referrer,
        "user_agent": ""
      }

  recent_fatals:
    type: filter
    inputs: [php_fatals]
    # A first install reads whole logs; skip old fatals.
    condition: |
      to_unix_timestamp(parse_timestamp!(.timestamp, "%Y-%m-%d %H:%M:%S%.f", timezone: "UTC")) >= to_unix_timestamp(now()) - 86400

  server_errors:
    type: remap
    inputs: [error_lines]
    drop_on_abort: true
    drop_on_error: true
    source: |
      raw = string!(.message)
      if contains(raw, "FastCGI sent in stderr") || contains(raw, "PHP Fatal error:") || contains(raw, "PHP Parse error:") { abort }

      exception = ""
      time = null
      client = ""
      referrer = ""
      method = "-"
      path = ""
      detail = ""

      if starts_with(raw, "[") {
        entry = parse_regex(raw, r'^\[(?P<time>\w{3} \w{3} \d{2} \d{2}:\d{2}:\d{2}(?:\.\d+)? \d{4})\] \[proxy_fcgi:error\] \[[^\]]*\](?: \[client (?P<client>[^\]]*)\])? (?:\((?P<code>\d+)\)(?P<reason>[^:]*): )?(?P<id>AH\d+): (?P<text>.*?)(?:, referer: (?P<referer>.*))?$') ?? null
        if entry == null { abort }
        id = string!(entry.id)
        code = string(entry.code) ?? ""
        if id == "AH01079" { exception = "PHP not responding" }
        if id == "AH01067" || (id == "AH01075" && code == "104") { exception = "PHP crashed mid-request" }
        if id == "AH01075" && code == "70007" { exception = "Request timed out" }
        time = parse_timestamp!(string!(entry.time), "%a %b %d %H:%M:%S%.f %Y")
        client = replace(string(entry.client) ?? "", r':\d+$', "")
        referrer = string(entry.referer) ?? ""
        detail = strip_whitespace(string(entry.reason) ?? "")
        if detail != "" { detail = detail + ": " }
        detail = detail + string!(entry.text)
      } else {
        entry = parse_regex(raw, r'^(?P<time>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) \[(?:error|crit|alert)\] \d+#\d+: (?:\*\d+ )?(?P<text>.*?)(?:, client: (?P<context>.*))?$') ?? null
        if entry == null { abort }
        text = string!(entry.text)
        if match(text, r'^upstream timed out .* while reading') { exception = "Request timed out" }
        if match(text, r'^(?:connect\(\) .*failed|upstream timed out) .* while (?:connecting|SSL handshaking) to upstream|^no live upstreams') { exception = "PHP not responding" }
        if match(text, r'^upstream prematurely closed connection|^recv\(\) failed \(104: Connection reset by peer\)') { exception = "PHP crashed mid-request" }
        if contains(text, "worker_connections are not enough") { exception = "nginx overloaded" }
        time = parse_timestamp!(string!(entry.time), "%Y/%m/%d %H:%M:%S")
        context = "client: " + (string(entry.context) ?? "")
        found = parse_regex(context, r'client: (?P<v>[^,]+)') ?? {}
        client = string(found.v) ?? ""
        found = parse_regex(context, r'request: "(?P<method>[A-Z]+) (?P<path>[^ "?]*)') ?? {}
        method = string(found.method) ?? "-"
        path = string(found.path) ?? ""
        found = parse_regex(context, r'referrer: "(?P<v>[^"]*)"') ?? {}
        referrer = string(found.v) ?? ""
        detail = replace(text, r'unix:\S+', "unix socket")
      }
      if exception == "" { abort }
      # Bots opening WordPress files directly, not a broken site.
      if match(path, r'(?:^|/)wp-(?:content|includes|admin/includes)/.*\.php$') { abort }
      # A first install reads whole logs; skip old errors.
      if to_unix_timestamp(time) < to_unix_timestamp(now()) - 86400 { abort }

      sentences = {
        "PHP not responding": "PHP is not responding",
        "Request timed out": "A request timed out",
        "PHP crashed mid-request": "PHP stopped in the middle of a request",
        "nginx overloaded": "nginx ran out of connections"
      }
      message = "[" + string!(.site_label) + "] " + string!(get!(sentences, [exception]))
      url = string!(.site_url)
      if path != "" {
        message = message + " on " + method + " " + path
        if url != "" { url = url + path }
      }

      . = {
        "timestamp": format_timestamp!(time, "%Y-%m-%d %H:%M:%S%.3f", timezone: "UTC"),
        "app": "SECRET[settings.app]",
        "environment": "production",
        "channel": "server",
        "level": "warning",
        "message": message,
        "context": encode_json({
          "kind": exception,
          "url": url,
          "method": method,
          "ip": client,
          "referrer": referrer,
          "detail": detail
        }),
        "hostname": string!(.host),
        "throttle_key": md5(string!(.site_key) + "|" + exception)
      }

  requests:
    type: remap
    inputs: [access_logs]
    drop_on_abort: true
    drop_on_error: true
    source: |
      entry = parse_regex(string!(.message), r'^(?P<client>\S+) \S+ \S+ \[(?P<time>[^\]]+)\] "(?:(?P<method>[A-Z]+) (?P<path>[^ "?]*))?[^"]*" (?P<status>\d{3}) \S+ "[^"]*" "(?P<agent>[^"]*)"(?: "(?P<forwarded>[^"]*)" "(?P<origin>[^"]*)")?') ?? null
      if entry == null { abort }
      # A backlog counted as live traffic would look like a spike.
      if to_unix_timestamp(parse_timestamp!(string!(entry.time), "%d/%b/%Y:%H:%M:%S %z")) < to_unix_timestamp(now()) - 120 { abort }

      ip = string!(entry.client)
      forwarded = string(entry.forwarded) ?? "-"
      if forwarded != "-" && forwarded != "" {
        # Behind Cloudflare the last forwarded address is the visitor.
        addresses = split(forwarded, ",")
        ip = strip_whitespace(string!(addresses[-1]))
      }
      method = string(entry.method) ?? ""
      path = string(entry.path) ?? ""

      host = string(.host) ?? "unknown"
      log_path = string(.file) ?? ""
      name = "unknown"
      domain = ""
      plesk = parse_regex(log_path, r'^/var/www/vhosts/system/(?P<domain>[^/]+)/logs/') ?? null
      runcloud = parse_regex(log_path, r'/logs/nginx/(?P<webapp>.+?)_access\.log$') ?? null
      if plesk != null {
        domain = string!(plesk.domain)
        name = domain
      } else if runcloud != null {
        name = string!(runcloud.webapp)
        row, missing = get_enrichment_table_record("sites", {"webapp": name})
        if missing == null { domain = string(row.domain) ?? "" }
      }
      if domain == "" {
        found = parse_regex(string(entry.origin) ?? "", r'^https?://(?P<v>[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+)$') ?? {}
        domain = string(found.v) ?? ""
      }
      label = name
      url = ""
      if domain != "" {
        label = domain
        url = "https://" + domain
      }

      . = {
        "site_key": host + "/" + name,
        "label": label,
        "url": url,
        "host": host,
        "status": to_int!(entry.status),
        "ip": ip,
        "path": truncate(path, 200),
        "agent": truncate(string!(entry.agent), 200),
        "login": method == "POST" && (ends_with(path, "/wp-login.php") || ends_with(path, "/xmlrpc.php"))
      }

  traffic:
    type: lua
    version: "2"
    inputs: [requests]
    source: |
      -- Caps memory when a flood brings endless new IPs, paths or user agents.
      MAX_KEYS = 500
      WARMUP_MINUTES = 30
      SMOOTHING_MINUTES = 60

      function init()
        sites = {}
        usual = {}
      end

      local function counter()
        return { counts = {}, size = 0 }
      end

      local function tally(map, key)
        local count = map.counts[key]
        if count then
          map.counts[key] = count + 1
        elseif map.size < MAX_KEYS then
          map.counts[key] = 1
          map.size = map.size + 1
        end
      end

      local function top(map, field, limit)
        local rows = {}
        for value, requests in pairs(map.counts) do
          rows[#rows + 1] = { [field] = value, requests = requests }
        end
        table.sort(rows, function(a, b) return a.requests > b.requests end)
        local result = {}
        for i = 1, math.min(limit, #rows) do
          result[i] = rows[i]
        end
        return result
      end

      local function learn(key, requests)
        local history = usual[key]
        if not history then
          history = { level = 0, minutes = 0 }
          usual[key] = history
        end
        history.minutes = history.minutes + 1
        if history.minutes <= WARMUP_MINUTES then
          history.level = history.level + (requests - history.level) / history.minutes
        else
          -- An attack can't drag the usual level up quickly.
          local capped = math.min(requests, history.level * 3 + 10)
          history.level = history.level + (capped - history.level) / SMOOTHING_MINUTES
        end
      end

      function process(event, emit)
        local log = event.log
        local site = sites[log.site_key]
        if not site then
          site = {
            label = log.label, url = log.url, host = log.host,
            requests = 0, server_errors = 0, logins = 0, statuses = {},
            ips = counter(), paths = counter(), error_paths = counter(), agents = counter(), login_ips = counter(),
          }
          sites[log.site_key] = site
        end
        local status = tostring(log.status)
        site.requests = site.requests + 1
        site.statuses[status] = (site.statuses[status] or 0) + 1
        tally(site.ips, log.ip)
        tally(site.paths, log.path)
        tally(site.agents, log.agent)
        if log.status >= 500 then
          site.server_errors = site.server_errors + 1
          tally(site.error_paths, log.path)
        end
        if log.login then
          site.logins = site.logins + 1
          tally(site.login_ips, log.ip)
        end
      end

      function flush(emit)
        for key, site in pairs(sites) do
          local history = usual[key]
          local usual_requests = nil
          if history and history.minutes >= WARMUP_MINUTES then
            usual_requests = math.floor(history.level + 0.5)
          end
          emit({ log = {
            site_key = key, label = site.label, url = site.url, host = site.host,
            requests = site.requests, server_errors = site.server_errors, statuses = site.statuses,
            usual_requests = usual_requests, logins = site.logins,
            top_ips = top(site.ips, "ip", 5),
            top_paths = top(site.paths, "path", 5),
            top_error_paths = top(site.error_paths, "path", 5),
            top_user_agents = top(site.agents, "user_agent", 3),
            top_login_ips = top(site.login_ips, "ip", 5),
          } })
        end
        for key, history in pairs(usual) do
          if not sites[key] then
            learn(key, 0)
            if history.minutes > WARMUP_MINUTES and history.level < 0.01 then
              usual[key] = nil
            end
          end
        end
        for key, site in pairs(sites) do
          learn(key, site.requests)
        end
        sites = {}
      end
    hooks:
      init: init
      process: process
      shutdown: flush
    timers:
      - interval_seconds: 60
        handler: flush

  traffic_alerts:
    type: remap
    inputs: [traffic]
    drop_on_abort: true
    drop_on_error: true
    source: |
      requests = to_int!(.requests)
      errors = to_int!(.server_errors)
      usual = -1
      if .usual_requests != null { usual = to_int(.usual_requests) ?? -1 }
      login_top = to_int(.top_login_ips[0].requests) ?? 0
      failing = errors >= 5 && errors * 2 >= requests
      spike = requests >= 3000 || (usual >= 0 && requests >= 300 && requests >= usual * 10)
      brute = login_top >= 60
      if !failing && !spike && !brute { abort }

      label = "[" + string!(.label) + "] "
      site_key = string!(.site_key)
      top_ip = string(.top_ips[0].ip) ?? ""
      url = string!(.url)
      stats = {
        "requests": requests,
        "usual_requests": .usual_requests,
        "server_errors": errors,
        "statuses": .statuses,
        "top_ips": .top_ips,
        "top_paths": .top_paths,
        "top_error_paths": .top_error_paths,
        "top_user_agents": .top_user_agents,
        "login_attempts": .logins,
        "top_login_ips": .top_login_ips
      }
      common = {
        "timestamp": format_timestamp!(now(), "%Y-%m-%d %H:%M:%S%.3f", timezone: "UTC"),
        "app": "SECRET[settings.app]",
        "environment": "production",
        "file": "",
        "line": 0,
        "trace": "",
        "url": url,
        "method": "-",
        "user_id": 0,
        "input": encode_json(stats),
        "hostname": string!(.host),
        "entrypoint": "http",
        "ip": top_ip,
        "referrer": "",
        "user_agent": string(.top_user_agents[0].user_agent) ?? ""
      }
      log_row = {
        "timestamp": common.timestamp,
        "app": "SECRET[settings.app]",
        "environment": "production",
        "level": "warning",
        "hostname": string!(.host)
      }
      alerts = []

      # Only a site that is breaking alerts; activity it handles goes to the Logs page.
      if spike {
        message = to_string(requests) + " requests in one minute"
        if usual > 0 {
          message = message + " (usually about " + to_string(usual) + ")"
        } else if usual == 0 {
          message = message + " (usually under 1)"
        }
        share = to_int(floor((to_int(.top_ips[0].requests) ?? 0) * 100 / requests ?? 0))
        if share >= 10 {
          message = message + ", " + to_string(share) + "% from " + top_ip
        } else {
          message = message + " from many addresses"
        }
        if errors > 0 { message = message + ", " + to_string(errors) + " server errors" }
        if errors >= 5 && errors * 10 >= requests {
          fingerprint = md5(site_key + "|Traffic spike")
          alerts = push(alerts, merge(common, {"exception": "Traffic spike", "message": label + message, "fingerprint": fingerprint, "throttle_key": fingerprint}))
        } else {
          alerts = push(alerts, merge(log_row, {"channel": "traffic", "message": label + message, "context": encode_json(merge({"kind": "Traffic spike", "url": url, "ip": top_ip}, stats)), "throttle_key": md5(site_key + "|Traffic spike|log")}))
        }
      } else if failing {
        message = to_string(errors) + " of " + to_string(requests) + " requests got a server error in one minute"
        worst_path = string(.top_error_paths[0].path) ?? ""
        if worst_path != "" && (to_int(.top_error_paths[0].requests) ?? 0) * 2 > errors {
          message = message + ", mostly on " + worst_path
        }
        fingerprint = md5(site_key + "|Site failing")
        alerts = push(alerts, merge(common, {"exception": "Site failing", "message": label + message, "fingerprint": fingerprint, "throttle_key": fingerprint}))
      }

      if brute {
        login_ip = string(.top_login_ips[0].ip) ?? ""
        message = to_string(login_top) + " login attempts in one minute from " + login_ip
        alerts = push(alerts, merge(log_row, {"channel": "security", "message": label + message, "context": encode_json(merge({"kind": "Brute force", "url": url, "ip": login_ip}, stats)), "throttle_key": md5(site_key + "|Brute force|log")}))
      }

      . = alerts

  one_per_fingerprint:
    type: throttle
    inputs: [recent_fatals]
    key_field: "{{ fingerprint }}"
    threshold: 1
    window_secs: 300

  server_cap:
    type: throttle
    inputs: [one_per_fingerprint]
    threshold: 300
    window_secs: 60

  # Kept out of server_cap so a flood of PHP errors can't hide these.
  one_alert_per_site:
    type: throttle
    inputs: [traffic_alerts]
    key_field: "{{ throttle_key }}"
    threshold: 1
    window_secs: 300

  traffic_split:
    type: route
    inputs: [one_alert_per_site]
    route:
      errors: '!exists(.channel)'
      logs: 'exists(.channel)'

  server_error_cap:
    type: throttle
    inputs: [server_errors]
    key_field: "{{ throttle_key }}"
    threshold: 5
    window_secs: 300

sinks:
  log_central:
    type: http
    inputs: [server_cap, traffic_split.errors]
    uri: "SECRET[settings.url]/api/errors"
    method: post
    encoding:
      codec: json
      except_fields: [throttle_key]
    auth:
      strategy: bearer
      token: "SECRET[settings.token]"
    batch:
      max_events: 100
      timeout_secs: 5
    # Unsent errors stay in the log files and are read again once Log Central is back.
    acknowledgements:
      enabled: true
    buffer:
      type: memory
      max_events: 1000
      when_full: block
    healthcheck:
      enabled: false

  # The Logs page never alerts.
  log_central_logs:
    type: http
    inputs: [server_error_cap, traffic_split.logs]
    uri: "SECRET[settings.url]/api/logs"
    method: post
    encoding:
      codec: json
      except_fields: [throttle_key]
    auth:
      strategy: bearer
      token: "SECRET[settings.token]"
    batch:
      max_events: 100
      timeout_secs: 5
    acknowledgements:
      enabled: true
    buffer:
      type: memory
      max_events: 1000
      when_full: block
    healthcheck:
      enabled: false
