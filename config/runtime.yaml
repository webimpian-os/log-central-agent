data_dir: /var/lib/log-central-agent
timezone: local

secret:
  settings:
    type: directory
    path: /etc/log-central-agent/secrets
    remove_trailing_whitespace: true

enrichment_tables:
  sites:
    type: file
    file:
      path: /var/lib/log-central-agent/sites.csv
      encoding:
        type: csv
