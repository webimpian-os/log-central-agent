tests:
  - name: uncaught error becomes a Log Central error with a site-relative trace
    inputs:
      - insert_at: error_lines
        type: log
        log_fields:
          host: web-01
          file: /home/demoshop/logs/apache2/demoshop_error.log
          message: |-
            [Fri Oct 23 11:20:14.109110 2026] [proxy_fcgi:error] [pid 1538:tid 1684] [client 203.0.113.9:0] AH01071: Got error 'PHP message: PHP Fatal error:  Uncaught Error: Class "NinjaFirewall_log" not found in /home/demoshop/webapps/demoshop/public/wp-content/nfwlog/dropins.php:2\nStack trace:\n#0 /home/demoshop/webapps/demoshop/public/wp-content/nfwlog/dropins.php(2): nfw_dropin_block()\n#1 /home/demoshop/webapps/demoshop/public/wp-content/plugins/ninjafirewall/lib/utils.php(1728): include_once('...')\n#2 /home/demoshop/webapps/demoshop/public/wp-includes/class-wp-hook.php(341): nfw_dropins()\n#3 /home/demoshop/webapps/demoshop/public/wp-bl...', referer: https://demo-shop.test/shop/
    outputs:
      - extract_from: php_fatals
        conditions:
          - type: vrl
            source: |
              assert_eq!(.timestamp, "2026-10-23 03:20:14.109")
              assert_eq!(.app, "wordpress-sites")
              assert_eq!(.environment, "production")
              assert_eq!(.exception, "Error")
              assert_eq!(.message, "[demo-shop.test] ninjafirewall plugin: Class \"NinjaFirewall_log\" not found")
              assert_eq!(.file, "public/wp-content/nfwlog/dropins.php")
              assert_eq!(.line, 2)
              assert!(starts_with(string!(.trace), "#0 public/wp-content/nfwlog/dropins.php(2): nfw_dropin_block()\n#1 public/wp-content/plugins/"))
              assert!(ends_with(string!(.trace), "public/wp-bl..."))
              assert!(!contains(string!(.trace), "/home/"))
              assert_eq!(.url, "https://demo-shop.test")
              assert_eq!(.method, "-")
              assert_eq!(.user_id, 0)
              assert_eq!(.input, "{}")
              assert_eq!(.hostname, "web-01")
              assert_eq!(.entrypoint, "http")
              assert_eq!(.ip, "203.0.113.9")
              assert_eq!(.referrer, "https://demo-shop.test/shop/")
              assert_eq!(.user_agent, "")
              assert_eq!(.fingerprint, md5("demo-shop.test|Error|public/wp-content/nfwlog/dropins.php|2"))

  - name: plain fatal keeps only the first fatal on the line
    inputs:
      - insert_at: error_lines
        type: log
        log_fields:
          host: web-01
          file: /home/demoshop/logs/apache2/demoshop_error.log
          message: |-
            [Thu Aug 13 12:09:22.678602 2026] [proxy_fcgi:error] [pid 2276408:tid 2276437] [client 203.0.113.9:0] AH01071: Got error 'PHP message: PHP Fatal error:  Allowed memory size of 1073741824 bytes exhausted (tried to allocate 67108864 bytes) in /home/demoshop/webapps/demoshop/public/wp-content/plugins/woo-order-export-lite/classes/vendor/phpoffice/phpspreadsheet/src/PhpSpreadsheet/Cell/Cell.php on line 209; PHP message: PHP Fatal error:  Allowed memory size of 1073741824 bytes exhausted (tried to allocate 67108864 bytes) in /home/demoshop/webapps/demoshop/public/wp-includes/class-wp-fatal-error-handler.php on line 237', referer: https://demo-shop.test/wp-admin/admin.php?page=wc-order-export
    outputs:
      - extract_from: php_fatals
        conditions:
          - type: vrl
            source: |
              assert_eq!(.exception, "PHP Fatal error")
              assert_eq!(.message, "[demo-shop.test] woo-order-export-lite plugin: Allowed memory size of 1073741824 bytes exhausted (tried to allocate 67108864 bytes)")
              assert_eq!(.file, "public/wp-content/plugins/woo-order-export-lite/classes/vendor/phpoffice/phpspreadsheet/src/PhpSpreadsheet/Cell/Cell.php")
              assert_eq!(.line, 209)
              assert_eq!(.trace, "")
              assert_eq!(.referrer, "https://demo-shop.test/wp-admin/admin.php?page=wc-order-export")

  - name: fatal after other PHP messages, with escaped backslashes and a cut-off trace
    inputs:
      - insert_at: error_lines
        type: log
        log_fields:
          host: web-01
          file: /home/bakery/logs/apache2/bakery_error.log
          message: |-
            [Tue Jul 28 12:30:01.521783 2026] [proxy_fcgi:error] [pid 1818388:tid 1818518] [client 203.0.113.9:0] AH01071: Got error 'PHP message: WordPress database error Unknown column 'key' in 'wp_ac_segments' made by require_once('wp-settings.php'), AC\\Service\\Setup->runPHP message: PHP Fatal error:  Uncaught ValueError: curl_setopt(): Argument #2 ($option) is not a valid cURL option in /home/bakery/webapps/bakery/public/wp-content/plugins/bugsnag/bugsnag-php/Notification.php:239\nStack trace:\n#0 /home/bakery/webapps/bakery/public/wp-content/plugins/bugsnag/bugsnag-php/Notification.php(239): curl_setopt()\n#1 /home/bakery/webapps/bakery/public/wp-con...'
    outputs:
      - extract_from: php_fatals
        conditions:
          - type: vrl
            source: |
              assert_eq!(.exception, "ValueError")
              assert_eq!(.message, "[bakery.test] bugsnag plugin: curl_setopt(): Argument #2 ($option) is not a valid cURL option")
              assert_eq!(.file, "public/wp-content/plugins/bugsnag/bugsnag-php/Notification.php")
              assert_eq!(.line, 239)
              assert_eq!(.trace, "#0 public/wp-content/plugins/bugsnag/bugsnag-php/Notification.php(239): curl_setopt()\n#1 public/wp-con...")
              assert_eq!(.referrer, "")
              assert_eq!(.url, "https://bakery.test")

  - name: trace cut off inside a home path keeps no server path
