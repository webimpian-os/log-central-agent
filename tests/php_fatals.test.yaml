          host: web-01
          file: /home/demoshop/logs/apache2/demoshop_error.log
          message: |-
            [Sat Oct 31 09:00:00.000001 2026] [proxy_fcgi:error] [pid 1:tid 2] [client 203.0.113.9:0] AH01071: Got error 'PHP message: PHP Fatal error:  Uncaught Error: boom in /home/demoshop/webapps/demoshop/public/wp-content/plugins/demo/demo.php:5\nStack trace:\n#0 /home/demoshop/webapps/demoshop/public/wp-includes/class-wp-hook.php(341): demo()\n#1 /home/demosh...'
    outputs:
      - extract_from: php_fatals
        conditions:
          - type: vrl
            source: |
              assert_eq!(.trace, "#0 public/wp-includes/class-wp-hook.php(341): demo()\n#1 ...")

  - name: parse error
    inputs:
      - insert_at: error_lines
        type: log
        log_fields:
          host: web-01
          file: /home/demoshop/logs/apache2/demoshop_error.log
          message: |-
            [Sat Oct 31 09:00:00.000001 2026] [proxy_fcgi:error] [pid 1:tid 2] [client 203.0.113.9:0] AH01071: Got error 'PHP message: PHP Parse error:  syntax error, unexpected token "}" in /home/demoshop/webapps/demoshop/public/wp-content/themes/storefront/functions.php on line 12'
    outputs:
      - extract_from: php_fatals
        conditions:
          - type: vrl
            source: |
              assert_eq!(.timestamp, "2026-10-31 01:00:00.000")
              assert_eq!(.exception, "PHP Parse error")
              assert_eq!(.message, "[demo-shop.test] storefront theme: syntax error, unexpected token \"}\"")
              assert_eq!(.file, "public/wp-content/themes/storefront/functions.php")
              assert_eq!(.line, 12)

  - name: unknown site on a rotated log falls back to the webapp name and a namespaced class
    inputs:
      - insert_at: error_lines
        type: log
        log_fields:
          host: web-01
          file: /home/newsite/logs/apache2/newsite_error.log-20261001
          message: |-
            [Sat Oct 31 09:00:00.000001 2026] [proxy_fcgi:error] [pid 1:tid 2] [client 2001:db8::7:0] AH01071: Got error 'PHP message: PHP Fatal error:  Uncaught Automattic\\WooCommerce\\Vendor\\Exception: boom in /home/newsite/webapps/newsite/public/wp-content/plugins/woocommerce/src/Example.php:10\nStack trace:\n#0 /home/newsite/webapps/newsite/public/wp-settings.php(593): Example->run()\n#1 {main}\n  thrown in /home/newsite/webapps/newsite/public/wp-content/plugins/woocommerce/src/Example.php on line 10'
    outputs:
      - extract_from: php_fatals
        conditions:
          - type: vrl
            source: |
              assert_eq!(.exception, "Automattic\\WooCommerce\\Vendor\\Exception")
              assert_eq!(.message, "[newsite] woocommerce plugin: boom")
              assert_eq!(.trace, "#0 public/wp-settings.php(593): Example->run()\n#1 {main}")
              assert_eq!(.url, "")
              assert_eq!(.ip, "2001:db8::7")
              assert_eq!(.fingerprint, md5("web-01/newsite|Automattic\\WooCommerce\\Vendor\\Exception|public/wp-content/plugins/woocommerce/src/Example.php|10"))

  - name: a bot opening a WordPress file directly is a security notice, not an error
    inputs:
      - insert_at: error_lines
        type: log
        log_fields:
          host: web-01
          file: /home/demoshop/logs/apache2/demoshop_error.log
          message: |-
            [Mon Oct 12 22:59:08.578805 2026] [proxy_fcgi:error] [pid 2649:tid 2691] [client 203.0.113.9:0] AH01071: Got error 'PHP message: PHP Fatal error:  Uncaught Error: Call to undefined function add_action() in /home/demoshop/webapps/demoshop/public/wp-includes/blocks/search.php:213\nStack trace:\n#0 {main}\n  thrown in /home/demoshop/webapps/demoshop/public/wp-includes/blocks/search.php on line 213', referer: http://demo-shop.test/wp-includes/blocks/search.php
    outputs:
      - extract_from: php_fatals
        conditions:
          - type: vrl
            source: |
              assert_eq!(.channel, "security")
              assert_eq!(.level, "notice")
              assert_eq!(.message, "[demo-shop.test] A bot opened public/wp-includes/blocks/search.php directly from 203.0.113.9")
              assert_eq!(.throttle_key, md5("demo-shop.test|Bot opening WordPress files"))
              assert!(!exists(.fingerprint))
              assert_eq!(parse_json!(.context).kind, "Bot opening WordPress files")

  - name: a bot tripping a missing ABSPATH is a security notice, not an error
    inputs:
      - insert_at: error_lines
        type: log
        log_fields:
          host: web-01
          file: /home/demoshop/logs/apache2/demoshop_error.log
          message: |-
            [Sat Jul 25 08:08:14.192153 2026] [proxy_fcgi:error] [pid 2646:tid 2694] [client 203.0.113.9:0] AH01071: Got error 'PHP message: PHP Warning:  Use of undefined constant ABSPATH - assumed 'ABSPATH' (this will throw an Error in a future version of PHP) in /home/demoshop/webapps/demoshop/public/wp-includes/blocks/index.php on line 9PHP message: PHP Fatal error:  require(): Failed opening required 'ABSPATHWPINC/blocks/archives.php' (include_path='.:') in /home/demoshop/webapps/demoshop/public/wp-includes/blocks/index.php on line 9'
    outputs:
      - extract_from: php_fatals
        conditions:
          - type: vrl
            source: |
              assert_eq!(.channel, "security")
              assert_eq!(.message, "[demo-shop.test] A bot opened public/wp-includes/blocks/index.php directly from 203.0.113.9")
              assert!(!exists(.fingerprint))

  - name: warnings alone are not reported
    no_outputs_from: [php_fatals]
    inputs:
      - insert_at: error_lines
        type: log
        log_fields:
          host: web-01
          file: /home/demoshop/logs/apache2/demoshop_error.log
          message: |-
            [Sat Oct 31 09:00:00.000001 2026] [proxy_fcgi:error] [pid 1:tid 2] [client 203.0.113.9:0] AH01071: Got error 'PHP message: PHP Warning:  Undefined array key "id" in /home/demoshop/webapps/demoshop/public/wp-content/themes/storefront/functions.php on line 40'

  - name: apache's own errors are not reported
    no_outputs_from: [php_fatals]
    inputs:
      - insert_at: error_lines
        type: log
        log_fields:
          host: web-01
          file: /home/demoshop/logs/apache2/demoshop_error.log
          message: |-
            [Sat Oct 31 09:00:00.000001 2026] [core:error] [pid 1:tid 2] [client 203.0.113.9:0] AH00126: Invalid URI in request GET /%%32%65 HTTP/1.1

  - name: fatals from the last day pass
    inputs:
      - insert_at: recent_fatals
        type: vrl
        source: |
          . = {"timestamp": format_timestamp!(now(), "%Y-%m-%d %H:%M:%S%.3f", timezone: "UTC")}
    outputs:
      - extract_from: recent_fatals
        conditions:
          - type: vrl
            source: assert!(exists(.timestamp))

  - name: fatals older than a day are skipped
    no_outputs_from: [recent_fatals]
    inputs:
      - insert_at: recent_fatals
        type: vrl
        source: |
          . = {"timestamp": format_timestamp!(from_unix_timestamp!(to_unix_timestamp(now()) - 90000),"%Y-%m-%d %H:%M:%S%.3f", timezone: "UTC")}

  - name: nginx entry on Plesk keeps the request and marks where nginx cut the trace
    inputs:
      - insert_at: error_lines
        type: log
        log_fields:
          host: web-02
          file: /var/www/vhosts/system/shop.test/logs/proxy_error_log
          message: |-
            2026/10/31 15:11:03 [error] 469575#0: *593091 FastCGI sent in stderr: "PHP message: PHP Fatal error:  Uncaught Error: Call to undefined method WP_Error::get_method() in /var/www/vhosts/shop.test/httpdocs/wp-includes/rest-api/class-wp-rest-server.php:1054
            Stack trace:
            #0 /var/www/vhosts/shop.test/httpdocs/wp-includes/rest-api/class-wp-rest-server.php(1654): WP_REST_Server->match_request_to_handler()
            #1 /var/www/vhosts/shop.test/httpdocs/wp-includes/rest-api/class-wp-rest-server.php(1193): WP_REST_Server->serve_batch_request_v1()
            #2 /var/www/vhosts/shop.te" while reading response header from upstream, client: 203.0.113.9, server: shop.test, request: "POST /wp-json/batch/v1?_locale=user HTTP/1.1", upstream: "fastcgi://unix:/var/www/vhosts/system/shop.test/php-fpm.sock:", host: "shop.test", referrer: "https://shop.test/wp-admin/post.php"
    outputs:
      - extract_from: php_fatals
        conditions:
          - type: vrl
            source: |
              assert_eq!(.timestamp, "2026-10-31 07:11:03.000")
              assert_eq!(.exception, "Error")
              assert_eq!(.message, "[shop.test] Call to undefined method WP_Error::get_method()")
              assert_eq!(.file, "httpdocs/wp-includes/rest-api/class-wp-rest-server.php")
              assert_eq!(.line, 1054)
              assert_eq!(.trace, "#0 httpdocs/wp-includes/rest-api/class-wp-rest-server.php(1654): WP_REST_Server->match_request_to_handler()\n#1 httpdocs/wp-includes/rest-api/class-wp-rest-server.php(1193): WP_REST_Server->serve_batch_request_v1()\n#2 ...")
              assert_eq!(.url, "https://shop.test/wp-json/batch/v1")
              assert_eq!(.method, "POST")
              assert_eq!(.ip, "203.0.113.9")
              assert_eq!(.referrer, "https://shop.test/wp-admin/post.php")
              assert_eq!(.hostname, "web-02")
              assert_eq!(.fingerprint, md5("shop.test|Error|httpdocs/wp-includes/rest-api/class-wp-rest-server.php|1054"))

  - name: nginx entry with quotes, raw backslashes and a full trace
    inputs:
      - insert_at: error_lines
        type: log
        log_fields:
          host: web-02
          file: /var/www/vhosts/system/shop.test/logs/proxy_error_log
          message: |-
            2026/10/31 16:00:00 [error] 1#0: *2 FastCGI sent in stderr: "PHP message: PHP Warning:  Undefined array key "id" in /var/www/vhosts/shop.test/httpdocs/wp-content/themes/demo/functions.php on line 40
            PHP message: PHP Fatal error:  Uncaught Automattic\WooCommerce\Vendor\Exception: Class "Demo_Gateway" not found in /var/www/vhosts/shop.test/httpdocs/wp-content/plugins/demo/demo.php:12
            Stack trace:
            #0 /var/www/vhosts/shop.test/httpdocs/wp-settings.php(545): include_once()
            #1 {main}
              thrown in /var/www/vhosts/shop.test/httpdocs/wp-content/plugins/demo/demo.php on line 12" while reading response header from upstream, client: 2001:db8::7, server: shop.test, request: "GET /checkout/ HTTP/2.0", upstream: "fastcgi://unix:/var/www/vhosts/system/shop.test/php-fpm.sock:", host: "www.shop.test"
    outputs:
      - extract_from: php_fatals
        conditions:
          - type: vrl
            source: |
              assert_eq!(.exception, "Automattic\\WooCommerce\\Vendor\\Exception")
              assert_eq!(.message, "[shop.test] demo plugin: Class \"Demo_Gateway\" not found")
              assert_eq!(.file, "httpdocs/wp-content/plugins/demo/demo.php")
              assert_eq!(.trace, "#0 httpdocs/wp-settings.php(545): include_once()\n#1 {main}")
              assert_eq!(.url, "https://shop.test/checkout/")
              assert_eq!(.method, "GET")
              assert_eq!(.ip, "2001:db8::7")
              assert_eq!(.referrer, "")

