              assert_eq!(.trace, "#0 help.shop.test/include/class.file.php(549): FileStorage->getBackend()\n#1 help.shop.test/index.php(17): require('...')\n#2 {main}")

  - name: an error inside WordPress is blamed on the nearest plugin in the trace
    inputs:
      - insert_at: error_lines
        type: log
        log_fields:
          host: web-02
          file: /var/www/vhosts/system/shop.test/logs/error_log
          message: |-
            [Tue Oct 20 13:25:40.099250 2026] [proxy_fcgi:error] [pid 1:tid 2] [client 203.0.113.9:0] AH01071: Got error 'PHP message: PHP Fatal error:  Uncaught TypeError: array_merge(): Argument #2 must be of type array, null given in /var/www/vhosts/shop.test/httpdocs/wp-includes/class-wp-hook.php:324\nStack trace:\n#0 /var/www/vhosts/shop.test/httpdocs/wp-includes/class-wp-hook.php(324): array_merge()\n#1 /var/www/vhosts/shop.test/httpdocs/wp-content/plugins/acme-forms/includes/hooks.php(88): WP_Hook->apply_filters()\n#2 /var/www/vhosts/shop.test/httpdocs/wp-content/themes/astra/functions.php(12): acme_forms_init()\n#3 {main}\n  thrown in /var/www/vhosts/shop.test/httpdocs/wp-includes/class-wp-hook.php on line 324'
    outputs:
      - extract_from: php_fatals
        conditions:
          - type: vrl
