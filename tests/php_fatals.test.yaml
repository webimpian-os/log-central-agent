    outputs:
      - extract_from: php_fatals
        conditions:
          - type: vrl
            source: |
              assert_eq!(.channel, "security")
              assert_eq!(.level, "notice")
              assert_eq!(.message, "[bakery.test] A scanner sent a broken REST batch request from 203.0.113.9")
              assert_eq!(.throttle_key, md5("bakery.test|Scanner probe"))
              assert!(!exists(.fingerprint))
              context = parse_json!(.context)
              assert_eq!(context.kind, "Scanner probe")
              assert_eq!(context.ip, "203.0.113.9")
              assert_eq!(context.detail, "Call to undefined method WP_Error::set_url_params()")

