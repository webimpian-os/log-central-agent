            2026/10/31 16:00:00 [error] 1#0: *2 FastCGI sent in stderr: "PHP message: PHP Fatal error:  Allowed memory size of 268435456 bytes exhausted (tried to allocate 20480 bytes) in /home/newsite/webapps/newsite/wp-includes/class-wpdb.php on line 2351" while reading response header from upstream, client: 203.0.113.9, server: new-site.test, request: "GET /?s=x HTTP/1.1", upstream: "fastcgi://unix:/var/run/newsite.sock:", host: "new-site.test"
